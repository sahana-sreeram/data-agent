<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Operations Console</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>Data Operations Console</h1>
  <div id="health-banner" class="banner">Checking pipeline health...</div>
  <div id="auto-scan-banner" class="banner">Health monitor starting...</div>
  <label class="checkbox-label" id="use-scripted-model-label">
    <input type="checkbox" id="use-scripted-model" checked />
    Scripted model
  </label>
  <button id="check-incidents-now-btn" type="button">Check for incidents now</button>
  <nav id="tab-nav">
    <button class="tab-button active" data-tab="overview">Overview</button>
    <button class="tab-button" data-tab="qa">Q&amp;A</button>
    <button class="tab-button" data-tab="run-details">Run Details</button>
  </nav>
</header>

<main>

  <!-- Overview -->
  <section id="tab-overview" class="tab-panel">
    <section class="card">
      <h2>Data estate</h2>
      <div id="overview-summary">Loading...</div>
    </section>
    <section class="card">
      <h2>Scale (measured)</h2>
      <div id="overview-scale">Loading...</div>
    </section>
  </section>

  <!-- Q&A -->
  <section id="tab-qa" class="tab-panel hidden">
    <section class="card">
      <h2>Ask a business question</h2>
      <form id="qa-form" class="inline-form">
        <input id="qa-question-input" type="text" placeholder="e.g. What is our total outstanding principal?" autocomplete="off" />
        <button type="submit">Ask</button>
      </form>
    </section>

    <div id="qa-spinner" class="spinner hidden">Working...</div>
    <div id="qa-error" class="error hidden"></div>

    <div id="qa-history"></div>
  </section>

  <!-- Run Details: one operational timeline + review view, consolidating what used to be
       separate Data Products and Repairs tabs. -->
  <section id="tab-run-details" class="tab-panel hidden">
    <section class="card">
      <h2>Data product estate</h2>
      <div id="run-details-estate">Loading...</div>
    </section>
    <section class="card" id="run-details-workflow-card">
      <h2>Workflow (Codex/MCP)</h2>
      <button id="codex-run-trigger-btn" type="button">Run Codex/MCP (loan_portfolio)</button>
      <div id="codex-run-status" class="muted"></div>
      <div id="run-details-workflow">Loading...</div>
    </section>
    <section class="card hidden" id="run-details-infra-card">
      <h2>Infrastructure</h2>
      <div id="run-details-infra"></div>
    </section>
    <section class="card">
      <h2>Review package</h2>
      <div id="run-details-repairs">
        <p class="muted">No repairs pending review.</p>
      </div>
    </section>
  </section>

</main>

<script src="/app.js"></script>
</body>
</html>
