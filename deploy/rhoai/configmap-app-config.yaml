# The 4 backend-selection flags src/config.py reads, plus the S3 bucket/endpoint non-secret
# values src/storage.py reads (S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY stay in secret.example.yaml,
# never here). Every value here is either a real, confirmed-safe default (matching this repo's
# local defaults) or a demo-scoped placeholder -- nothing here is a secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-agent-app-config
  namespace: data-agent
data:
  EXECUTION_BACKEND: "rhoai"
  RUNTIME_BACKEND: "spark_history"
  AGENT_HARNESS: "codex_mcp"
  STATE_BACKEND: "file"
  RHOAI_NAMESPACE: "data-agent"
  # A DIFFERENT image from this ConfigMap's own consumers (console/MCP servers use
  # data-agent:latest) -- RHOAISparkRunner submits SparkApplications using THIS image, which
  # must be built FROM a real Apache Spark image (deploy/rhoai/Dockerfile.spark), never the
  # console's bare python:3.12-slim image. See deploy/rhoai/sparkapplication-loan-portfolio.yaml's
  # header comment for why.
  RHOAI_SPARK_IMAGE: "image-registry.openshift-image-registry.svc:5000/data-agent/data-agent-spark:latest"
  SPARK_HISTORY_SERVER_URL: "http://spark-history-server:18080"
  MCP_DATA_OPS_URL: "http://mcp-data-ops:8000/mcp"
  MCP_SPARK_RUNTIME_URL: "http://mcp-spark-runtime:8000/mcp"
  S3_BUCKET: "data-agent"
  # Confirmed live (2026-07-28): openshift-storage.noobaa.io is administratively DISABLED on
  # this cluster (its StorageClass carries opendatahub.io/sc-config isEnabled:false) -- an
  # ObjectBucketClaim against it sits in Pending forever with zero events. Using a dedicated
  # in-cluster MinIO instead (deploy/rhoai/minio-deployment.yaml), same as local dev.
  S3_ENDPOINT_URL: "http://minio:9000"
  # Confirmed live: these pods run as an arbitrary, non-root OpenShift UID with HOME=/ (owned
  # by root, not writable) -- get_spark_session()'s spark.jars.packages triggers Ivy dependency
  # resolution under ${HOME}/.ivy2 on every LOCAL-mode SparkSession (console/create_candidate_repair/
  # verify_candidate_repair all use local mode, even on RHOAI -- only the Spark Operator's own
  # driver/executor pods, which have their jars baked in at build time instead, don't need this).
  # /tmp is world-writable regardless of UID.
  HOME: "/tmp"
