# One service account, used by every one of our own pods in this namespace: the console/API
# deployment, both MCP server deployments, and the Spark driver (spec.driver.serviceAccount in
# sparkapplication-loan-portfolio.yaml -- a Spark-on-k8s driver needs its own namespace-scoped
# permission to create/manage the executor pods and headless service it spawns, so it must run
# as a service account with those rights, not the namespace default). A larger deployment might
# split "my app" from "the spark driver" into two service accounts for tighter least-privilege
# separation; one is enough for this demo's scope.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-agent-app
  namespace: data-agent
