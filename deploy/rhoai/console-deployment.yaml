# The console/API (src/api.py, serving both the JSON API and the static Run Details UI) --
# the same FastAPI app that runs locally via `uvicorn src.api:app`, using the shared image's
# default ENTRYPOINT (see deploy/rhoai/Dockerfile). This is what deploy/rhoai/route-run-details.yaml
# exposes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-agent-console
  namespace: data-agent
  labels:
    app: data-agent-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-agent-console
  template:
    metadata:
      labels:
        app: data-agent-console
    spec:
      serviceAccountName: data-agent-app
      containers:
        - name: console
          image: "CHANGE_ME_IMAGE_REF"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: data-agent-app-config
            - secretRef:
                name: data-agent-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: data-agent-console
  namespace: data-agent
spec:
  selector:
    app: data-agent-console
  ports:
    - port: 8000
      targetPort: 8000
