# Runs src.mcp_servers.data_ops_server as a standalone streamable-HTTP service (see that
# module's main()) -- the exact same tool registration/handler code tested locally in
# tests/test_mcp_servers.py and tests/test_mcp_servers_integration.py, just reached over the
# network instead of in-process.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-data-ops
  namespace: data-agent
  labels:
    app: mcp-data-ops
    app.kubernetes.io/managed-by: claude-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-data-ops
  template:
    metadata:
      labels:
        app: mcp-data-ops
        app.kubernetes.io/managed-by: claude-demo
    spec:
      serviceAccountName: data-agent-app
      containers:
        - name: mcp-data-ops
          image: "image-registry.openshift-image-registry.svc:5000/data-agent/data-agent:latest"
          imagePullPolicy: Always
          command: ["python3", "-m", "src.mcp_servers.data_ops_server"]
          ports:
            - containerPort: 8000
          # Confirmed live: OOMKilled under the namespace LimitRange's default 1536Mi --
          # create_candidate_repair/verify_candidate_repair each run a real local-mode Spark
          # JVM (get_spark_session), and verify_candidate_repair's targeted-test rerun spins
          # up a SECOND one in a pytest subprocess concurrently with the first still live.
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          envFrom:
            - configMapRef:
                name: data-agent-app-config
            - secretRef:
                name: data-agent-secrets
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-data-ops
  namespace: data-agent
spec:
  selector:
    app: mcp-data-ops
  ports:
    - port: 8000
      targetPort: 8000
