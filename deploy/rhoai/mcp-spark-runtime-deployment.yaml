# Runs src.mcp_servers.spark_runtime_server as a standalone streamable-HTTP service (see that
# module's main()). Its PipelineRunner/RuntimeInspector are selected by src.config from this
# pod's own EXECUTION_BACKEND/RUNTIME_BACKEND env vars (data-agent-app-config sets both to the
# RHOAI-backed implementations) -- this is the one place submit_spark_pipeline actually talks
# to the Spark Operator, so this pod's service account needs deploy/rhoai/role.yaml's
# sparkapplications/pods permissions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-spark-runtime
  namespace: data-agent
  labels:
    app: mcp-spark-runtime
    app.kubernetes.io/managed-by: claude-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-spark-runtime
  template:
    metadata:
      labels:
        app: mcp-spark-runtime
        app.kubernetes.io/managed-by: claude-demo
    spec:
      serviceAccountName: data-agent-app
      containers:
        - name: mcp-spark-runtime
          image: "image-registry.openshift-image-registry.svc:5000/data-agent/data-agent:latest"
          imagePullPolicy: Always
          command: ["python3", "-m", "src.mcp_servers.spark_runtime_server"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: data-agent-app-config
            - secretRef:
                name: data-agent-secrets
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-spark-runtime
  namespace: data-agent
spec:
  selector:
    app: mcp-spark-runtime
  ports:
    - port: 8000
      targetPort: 8000
