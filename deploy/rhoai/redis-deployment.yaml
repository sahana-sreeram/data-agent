# Optional -- only needed when STATE_BACKEND=redis (data-agent-app-config defaults to "file",
# i.e. src.platform_backends.state_store.FileStateStore backed by the same S3 bucket everything
# else uses, which needs nothing extra deployed). Deploy this + flip STATE_BACKEND to "redis"
# only if S3-round-trip latency for the create_candidate_repair/verify_candidate_repair
# handoff genuinely becomes a bottleneck -- not expected at this demo's scale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: data-agent
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      serviceAccountName: data-agent-app
      containers:
        - name: redis
          image: "docker.io/redis:7-alpine"
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data-agent
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
