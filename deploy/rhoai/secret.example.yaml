# DO NOT COMMIT REAL VALUES. This is a template only -- every value below is a placeholder.
#
# Create the real Secret from local environment variables at deploy time (see RUNBOOK.md),
# e.g.:
#   oc create secret generic data-agent-secrets -n data-agent \
#     --from-literal=S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
#     --from-literal=S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
#     --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY"
# (never `oc apply -f` a filled-in copy of this file, and never echo/print these values --
# `oc create secret ... --from-literal=X="$X"` reads directly from the shell environment).
apiVersion: v1
kind: Secret
metadata:
  name: data-agent-secrets
  namespace: data-agent
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: "CHANGE_ME"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME"
  OPENAI_API_KEY: "CHANGE_ME"
