name: payment_performance

inputs:
  - dataset: payment_schedule
    source_service: payment_service
  - dataset: payment_events
    source_service: payment_service

outputs:
  - curated/payment_performance.parquet

runtime:
  engine: spark
  source_file: src/etl_spark_payment_performance.py
  functions:
    - compute_payment_performance

validation:
  module: src.validate_payment_performance
  function: validate_payment_performance
  rules_file: context/validations/payment_performance.json

metrics_file: context/metrics/payment_performance.json
lineage_key: curated.payment_performance
test_file: tests/test_etl_spark_payment_performance.py

repair:
  allowed_files:
    - src/etl_spark_payment_performance.py
  mode: open_pr

context:
  human_annotation: context/human/payment_performance.yaml
