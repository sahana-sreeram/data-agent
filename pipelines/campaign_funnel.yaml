name: campaign_funnel

inputs:
  - dataset: campaigns
    source_service: marketing_service
  - dataset: email_events
    source_service: marketing_service
  - dataset: prequal_offers
    source_service: marketing_service
  - dataset: applications
    source_service: application_service
  - dataset: underwriting_decisions
    source_service: underwriting_service
  - dataset: loans
    source_service: loan_service

outputs:
  - curated/campaign_funnel.parquet

runtime:
  engine: spark
  source_file: src/etl_spark_campaign_funnel.py
  functions:
    - compute_campaign_funnel
    - _attribute_applications_to_campaigns

validation:
  module: src.validate_campaign_funnel
  function: validate_campaign_funnel
  rules_file: context/validations/campaign_funnel.json

metrics_file: context/metrics/campaign_funnel.json
lineage_key: curated.campaign_funnel
test_file: tests/test_etl_spark_campaign_funnel.py

repair:
  allowed_files:
    - src/etl_spark_campaign_funnel.py
  mode: open_pr

context:
  human_annotation: context/human/campaign_funnel.yaml
