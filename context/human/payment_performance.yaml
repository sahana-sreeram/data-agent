# Minimal human-approved semantic context for payment_performance.

data_product: payment_performance
authoritative: true
owner: risk-data-team

metrics:
  collection_rate:
    canonical_definition: >
      Total collected amount (successful installments, net of reversals) divided by total
      expected amount for installments due on or before as_of_date.
    business_rule:
      successful_statuses: PAID
    approved_by: risk-finance
    approval_status: APPROVED

repair_policy:
  auto_repair:
    - ETL_LOGIC_JOIN
    - BUSINESS_RULE_MISMATCH
  human_review:
    - SOURCE_CONTRACT_CHANGE
    - AMBIGUOUS_BUSINESS_SEMANTICS

sensitive_data_classification: none
escalation_rules:
  - "A SOURCE_CONTRACT_CHANGE affecting payment_status always pages risk-data-team before
    any auto-repair is even proposed -- whether SETTLED (or any future status) counts as
    collected is a business decision, not a technical one."
